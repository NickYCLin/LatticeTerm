name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux amd64
            platform: ubuntu-22.04
          - name: Linux arm64
            platform: ubuntu-22.04-arm
          - name: Windows amd64
            platform: windows-latest
          - name: macOS arm64
            platform: macos-latest

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Linux desktop dependencies
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils pkg-config libclang-dev libxcb1-dev libxrandr-dev libdbus-1-dev libpipewire-0.3-dev libwayland-dev libegl-dev

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Verify Conventional Commits
        if: github.event_name == 'pull_request'
        run: node .github/scripts/check-conventional-commits.mjs "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Configure Linux bindgen
        if: startsWith(matrix.platform, 'ubuntu-')
        shell: bash
        run: echo "BINDGEN_EXTRA_CLANG_ARGS=-I$(gcc -print-file-name=include)" >> "$GITHUB_ENV"

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            crates/lattice-remote -> target
            crates/lattice-rdp -> target
            crates/lattice-vnc -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify frontend
        run: npm run check

      - name: Build desktop sidecars
        run: npm run build:sidecars

      - name: Check Rust formatting
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          cargo fmt --manifest-path crates/lattice-remote/Cargo.toml --check
          cargo fmt --manifest-path crates/lattice-rdp/Cargo.toml --check
          cargo fmt --manifest-path crates/lattice-vnc/Cargo.toml --check

      - name: Test Rust
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml
          cargo test --manifest-path crates/lattice-remote/Cargo.toml --features agent
          cargo test --manifest-path crates/lattice-rdp/Cargo.toml
          cargo test --manifest-path crates/lattice-vnc/Cargo.toml

      - name: Lint Rust
        run: |
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path crates/lattice-remote/Cargo.toml --features agent --all-targets -- -D warnings
          cargo clippy --manifest-path crates/lattice-rdp/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path crates/lattice-vnc/Cargo.toml --all-targets -- -D warnings

      - name: Build Tauri application
        run: npm run tauri build -- --no-bundle

  verify-android:
    name: Android aarch64
    runs-on: ubuntu-22.04

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: |
            src-tauri/gen/android/*.gradle*
            src-tauri/gen/android/**/build.gradle.kts
            src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Configure Android NDK
        shell: bash
        run: echo "NDK_HOME=$ANDROID_NDK" >> "$GITHUB_ENV"

      - name: Cache Android Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: android-aarch64

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Android debug APK
        run: npm run tauri android build -- --debug --apk --target aarch64
