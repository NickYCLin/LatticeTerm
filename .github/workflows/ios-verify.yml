name: iOS verification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "src-tauri/**"
      - "crates/lattice-remote/**"
      - "scripts/*ios*"
      - "package*.json"
      - ".github/workflows/ios-verify.yml"

permissions:
  contents: read

concurrency:
  group: ios-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    name: iOS Release simulator (no signing)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target
          key: ios-simulator
      - name: Select an installed Xcode 26 or newer
        shell: bash
        run: |
          python3 - <<'PY'
          import re, subprocess
          from pathlib import Path
          candidates = []
          for app in Path('/Applications').glob('Xcode*.app'):
              match = re.match(r'Xcode_(\d+)(?:\.(\d+))?(?:\.(\d+))?\.app$', app.name)
              if match and int(match[1]) >= 26:
                  candidates.append((tuple(int(part or 0) for part in match.groups()), app))
          if not candidates:
              raise SystemExit('Runner has no supported Xcode 26 installation')
          subprocess.run(['sudo', 'xcode-select', '-s', str(max(candidates)[1])], check=True)
          PY
          xcodebuild -version
      - run: npm ci
      - run: npm run ios:check
      - run: python3 scripts/test_verify_ios_app.py
      - name: Build the simulator app with bundled frontend assets
        run: npm run ios:simulator:release
      - name: Check the built bundle
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          apps = list(Path('src-tauri/gen/apple/build').rglob('LatticeTerm.app'))
          if not apps:
              raise SystemExit('No simulator app was produced')
          for app in apps:
              subprocess.run(['python3', 'scripts/verify-ios-app.py', str(app), '--build-number', '1', '--require-declared-api'], check=True)
          PY
      # This job deliberately creates no IPA, uses no Apple credentials,
      # and makes no TestFlight or App Store submission.
