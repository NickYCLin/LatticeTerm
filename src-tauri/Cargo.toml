[package]
name = "lattice-term"
version = "0.2.0"
description = "A secure, cross-platform workspace for SSH, SFTP, RDP, and remote desktop access."
authors = ["NickYCLin"]
edition = "2021"
license = "MPL-2.0"
repository = "https://github.com/NickYCLin/LatticeTerm"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "latticeterm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `ring` instead of the default aws-lc-rs backend: aws-lc-sys needs NASM and a
# C toolchain on Windows, and complicates Android/iOS cross-compilation.
russh = { version = "0.62.7", default-features = false, features = ["ring", "flate2", "rsa"] }
russh-sftp = "2.4.0"
sha2 = "0.11.0"
base64 = "0.23.1"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "io-util", "net", "sync", "time", "process"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
lattice-remote = { path = "../crates/lattice-remote" }
keyring = "4.1.6"
zeroize = "1.9.0"
