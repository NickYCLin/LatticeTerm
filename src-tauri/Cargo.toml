[package]
name = "lattice-term"
version = "0.29.0"
description = "A secure, cross-platform workspace for local AI CLIs, SSH, SFTP, RDP, and remote desktop access."
authors = ["NickYCLin"]
edition = "2021"
license = "MPL-2.0"
repository = "https://github.com/NickYCLin/lattice-term"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "latticeterm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
# `ring` instead of the default aws-lc-rs backend: aws-lc-sys needs NASM and a
# C toolchain on Windows, and complicates Android/iOS cross-compilation.
russh = { version = "0.63.1", default-features = false, features = ["ring", "flate2", "rsa"] }
russh-sftp = "2.4.0"
sha2 = "0.11.0"
base64 = "0.23.1"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "io-util", "net", "sync", "time", "process"] }
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
lattice-remote = { path = "../crates/lattice-remote" }
keyring = "4.1.6"
zeroize = "1.9.0"
portable-pty = "0.9.0"
libc = "0.2"
getrandom = "0.4.3"
argon2 = "0.5"
chacha20poly1305 = "0.11.0"
tempfile = "3.27.0"
png = "0.18.1"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18.2"
